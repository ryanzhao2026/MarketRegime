name: Build & Deploy Dashboard

# 触发方式：
#   1. push 到 main 分支 —— 改代码后自动重建仪表盘
#   2. 手动触发（Actions 页面点 Run workflow）
#   3. 每个交易日 UTC 22:30（美股收盘后）定时重建
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

# GitHub Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新任务不取消进行中的（避免半成品上线）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体（PNG 面板标签需要）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 运行 Regime 引擎
        run: python main.py --export-csv

      - name: 组装站点目录
        run: |
          mkdir -p _site
          # dashboard.html 是自包含单文件（内联 SVG），直接作为首页
          cp outputs/dashboard.html _site/index.html
          [ -f outputs/dashboard.png ] && cp outputs/dashboard.png _site/
          [ -f outputs/report.txt ] && cp outputs/report.txt _site/
          [ -f outputs/regime_history.csv ] && cp outputs/regime_history.csv _site/
          ls -la _site

      - name: 打印摘要到 Actions 日志
        run: cat outputs/report.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
